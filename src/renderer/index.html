<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Muesli capture spike</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; color: #222; }
    button { font: inherit; padding: 6px 14px; }
    .levels { display: flex; gap: 24px; margin: 16px 0; }
    meter { width: 220px; }
    pre { background: #f5f5f3; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <button id="toggle">Start recording</button>
  <div class="levels">
    <label>Me (mic) <meter id="lvl-me" min="0" max="1"></meter></label>
    <label>Them (system) <meter id="lvl-them" min="0" max="1"></meter></label>
  </div>
  <pre id="log"></pre>
  <script src="app.js"></script>
</body>
</html>
