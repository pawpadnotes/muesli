<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src muesli-audio:">
  <title>Muesli</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg hidden>
    <symbol id="i-logo" viewBox="0 0 16 16"><path d="M3 6v4M6.3 3.5v9M9.7 5v6M13 6.5v3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25"/><path d="m10.2 10.2 3.3 3.3"/></symbol>
    <symbol id="i-mic" viewBox="0 0 16 16"><rect x="5.75" y="1.75" width="4.5" height="8" rx="2.25"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.25"/></symbol>
    <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 16 16"><path d="M7 2.5 8.3 6 12 7.5 8.3 9 7 12.5 5.7 9 2 7.5 5.700 6zM12.5 10.500v3M11 12h3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.500" width="8" height="8" rx="1.5"/><path d="M10.500 5.500v-1.500a1.500 1.500 0 0 0-1.500-1.500h-5a1.500 1.500 0 0 0-1.500 1.500v5a1.500 1.500 0 0 0 1.500 1.500h1.500"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 4.500a1 1 0 0 1 1-1h3l1.500 1.500h5.500a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.500 4.500h11M6 4.500v-2h4v2M4 4.500l.600 8.500a1 1 0 0 0 1 1h4.800a1 1 0 0 0 1-1l.600-8.500"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 16 16"><path d="M2 5h6M11.500 5h2.500M2 11h2.500M8 11h6"/><circle cx="9.750" cy="5" r="1.750"/><circle cx="6.250" cy="11" r="1.750"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.500v9l7-4.500z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.500 3.500v9M10.500 3.500v9"/></symbol>
    <symbol id="i-pen" viewBox="0 0 16 16"><path d="M10.5 2.75 13.25 5.5 5.5 13.25H2.75V10.5zM9 4.25 11.75 7"/></symbol>
    <symbol id="i-pin" viewBox="0 0 16 16"><path d="M5.5 2.5h5M6.25 2.5v4L4.75 9.5h6.5L9.75 6.5v-4M8 9.5v4"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7"/></symbol>
  </svg>

  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="brand-tile"><svg class="icon"><use href="#i-logo"/></svg></div>
        <div class="brand-name">Muesli</div>
      </div>
      <div class="side-top">
        <button class="btn btn-ghost" id="new"><svg class="icon"><use href="#i-plus"/></svg>New meeting<span class="keys" data-keys="N"></span></button>
        <label class="search">
          <svg class="icon"><use href="#i-search"/></svg>
          <input class="input" id="search" placeholder="Search meetings" aria-label="Search meetings">
          <span class="keys" data-keys="K"></span>
        </label>
        <button class="btn btn-quiet" id="ask-all"><svg class="icon"><use href="#i-spark"/></svg>Ask your meetings</button>
      </div>
      <nav class="list" id="list"></nav>
      <div class="side-foot">
        <div class="status" id="status"></div>
        <button class="icon-btn" id="open-settings" title="Settings" aria-label="Settings"><svg class="icon"><use href="#i-sliders"/></svg></button>
      </div>
    </aside>
    <main class="main"><div class="topbar"><span class="bar-title" id="bar-title" aria-hidden="true"></span></div><div class="scroll"><div class="page" id="page"></div></div></main>
  </div>

  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status"></div>
  <audio id="audio-me" preload="metadata"></audio>
  <audio id="audio-them" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
